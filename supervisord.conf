; Three processes, one container, isolated by priority and thread count rather than
; by container boundaries. The container already runs unprivileged (Dockerfile USER),
; so supervisord sets no `user=`.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/callu/supervisord.pid

; Lets an operator inspect and restart a single process without recycling the
; container, which is the whole point of not running three of them.
;   docker exec callu-voice supervisorctl status
;   docker exec callu-voice supervisorctl restart tts
[unix_http_server]
file=/run/callu/supervisor.sock

[supervisorctl]
serverurl=unix:///run/callu/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; All three processes are required to place a call, so supervisord giving up on any
; of them must end the container — otherwise it stays up with a dead child and keeps
; reporting alive while it cannot page anyone.
[eventlistener:exit-on-fatal]
command=python -c "import os, signal, sys; sys.stdout.write('READY\n'); sys.stdout.flush(); sys.stdin.readline(); os.kill(os.getppid(), signal.SIGQUIT)"
events=PROCESS_STATE_FATAL
autorestart=true
; stdout is the event protocol channel, so it is not a log and redirect_stderr
; is rejected by supervisord for a listener.
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:asterisk]
; -p requests real-time priority; it takes effect where the runtime grants
; CAP_SYS_NICE to the non-root process, otherwise Asterisk runs at normal
; priority (see docker-compose.yml). It does its own graceful shutdown on TERM,
; which is what keeps a live call up while voice-api drains: supervisord signals
; every process at once on shutdown, so priority orders startup, not stopping.
; stopwaitsecs must therefore outlast voice-api's own budget below.
command=/usr/sbin/asterisk -f -p -vvv
priority=10
autorestart=true
startretries=10
startsecs=5
stopsignal=TERM
stopwaitsecs=65
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tts]
; Bound to localhost: nothing outside the container may reach the synthesizer.
; nice + a thread cap keep it from taking every core when a page is rendered.
command=nice -n 10 uvicorn app.main:app --host 127.0.0.1 --port 8080 --workers 1
directory=/srv/tts
priority=20
autorestart=true
startretries=10
startsecs=10
environment=OMP_NUM_THREADS="%(ENV_TTS_THREADS)s",SUPERTONIC_INTRA_OP_THREADS="%(ENV_TTS_THREADS)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:voice-api]
; On TERM it drains in-flight calls before exiting, so this must exceed the drain
; grace it logs at startup as "shutdown budget" — 42s at shipped defaults, plus a
; 10s HTTP shutdown. Raise it alongside CALLBACK_ATTEMPTS / CALLBACK_TIMEOUT /
; CALLBACK_BACKOFF, and raise the orchestrator's own grace period to match.
command=/usr/local/bin/voice-api
priority=30
autorestart=true
; Default 3 is far too few: this process waits up to 60s for ARI and exits if it
; is not there, so a slow Asterisk start burns the whole budget.
startretries=10
startsecs=5
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
