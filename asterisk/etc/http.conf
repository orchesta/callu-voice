[general]
; ARI rides on Asterisk's built-in HTTP server, which ships disabled.
enabled = yes
; Loopback only. ARI can originate calls and control channels, so it must never
; be reachable off the host — voice-api reaches it over localhost inside the same
; container. Do not change this to 0.0.0.0.
bindaddr = 127.0.0.1
bindport = 8088
