; The call flow lives in voice-api, not here. The dialplan exists only to give an
; outbound channel somewhere to run answering-machine detection before it reaches
; Stasis: AMD is a dialplan application and has no ARI equivalent.

[callu-outbound]
exten => s,1,NoOp(callu outbound ${CALLU_CALL_ID})
 ; AMD is opt-in. It costs a few seconds of listening and can misjudge a slow
 ; "hello", so a deployment that would rather ring a human twice leaves it off.
 same => n,ExecIf($["${CALLU_AMD}" = "true"]?AMD())
 same => n,Stasis(callu-voice)
 same => n,Hangup()

[from-trunk]
; Paging is outbound only. Reject inbound rather than letting it fall through to
; a default context.
exten => _X.,1,Hangup(21)          ; 21 = call rejected

[from-internal]
; Development: a softphone can dial 700 to enter the call flow without a carrier.
exten => 700,1,Answer()
 same => n,Stasis(callu-voice)
 same => n,Hangup()

; Development: play a rendered prompt by id, to prove the shared sounds volume
; resolves. Originate with SOUND set, e.g. SOUND=callu/<hash>.
exten => 701,1,Answer()
 same => n,Playback(${SOUND})
 same => n,Hangup()

[callu-testcallee]
; Development only: stands in for the person being paged, so the whole flow can
; be driven without a carrier or a softphone. Answers, listens, then presses a key.
exten => ack,1,Answer()
 same => n,Wait(6)
 same => n,SendDTMF(1)
 same => n,Wait(8)
 same => n,Hangup()

exten => escalate,1,Answer()
 same => n,Wait(6)
 same => n,SendDTMF(2)
 same => n,Wait(8)
 same => n,Hangup()

exten => silent,1,Answer()
 same => n,Wait(60)
 same => n,Hangup()

exten => noanswer,1,Wait(2)
 same => n,Hangup(19)          ; 19 = no user responding

; E.164 aliases so the call API (which enforces E.164 + a prefix allowlist) can
; drive the same behaviours end to end. +90 = the ALLOWED_PREFIXES used in dev.
exten => +905000000001,1,Goto(ack,1)
exten => +905000000002,1,Goto(escalate,1)
exten => +905000000003,1,Goto(noanswer,1)
exten => +905000000004,1,Goto(silent,1)
